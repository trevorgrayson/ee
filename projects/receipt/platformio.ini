[env:esp01_ticket_printer]
platform = espressif8266
board = esp01_1m
framework = arduino

; ✅ Serial monitor setup
monitor_speed = 115200

; ✅ Libraries used in the sketch
lib_deps =
    ESP8266WiFi
    ESP8266mDNS
    ESP8266WebServer
    ESP8266HTTPClient
    WiFiClientSecure
    LittleFS
    ArduinoJson
    adafruit/Adafruit Thermal Printer Library

; ✅ Build flags
; - Enable LittleFS and larger code size
; - Allow HTTPS with insecure certs
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LITTLEFS
    -D ARDUINOJSON_ENABLE_STD_STRING=1
    -D ARDUINOJSON_DECODE_UNICODE=1
    -D DEBUG_ESP_PORT=Serial
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"

; ✅ Flash size / filesystem size
board_build.filesystem = littlefs
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m.ld

; ✅ Optional: automatic upload via serial
upload_speed = 115200
upload_port = /dev/ttyUSB0   ; ← change to your serial adapter port
