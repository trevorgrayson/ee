[env:m5stack-core2]
platform = espressif32
board = m5stack-core-esp32
upload_protocol = esptool

framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified
  m5stack/M5GFX
  # m5stack/ESP32-A2DP
  # m5stack/ESP-SR
  espressif/esp-sr
  esphome/esp-audio-libs
  bblanchon/ArduinoJson
  knolleary/PubSubClient
  WiFiClientSecure
build_flags = 
  -DCORE_DEBUG_LEVEL=5

