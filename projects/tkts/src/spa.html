<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mobile Markdown Editor</title>
    <style>
        :root {
            --bg: #f6f6f3;
            --panel: rgba(255,255,255,0.98);
            --text: #1f1f1a;
            --muted: #6f6c63;
            --line: rgba(0,0,0,0.08);
            --accent: #111111;
            --shadow: 0 12px 32px rgba(0,0,0,0.10);
            --radius: 18px;
            --fab-size: 62px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overscroll-behavior: none;
        }

        .app {
            height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr;
            padding:
                    calc(8px + var(--safe-top))
                    calc(10px + var(--safe-right))
                    calc(10px + var(--safe-bottom))
                    calc(10px + var(--safe-left));
            gap: 8px;
            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 40px;
            padding: 0 4px;
        }

        .title-wrap {
            min-width: 0;
            flex: 1;
        }

        .title {
            margin: 0;
            font-size: 0.98rem;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 2px 0 0 0;
            font-size: 0.74rem;
            line-height: 1.1;
            color: var(--muted);
        }

        .status {
            white-space: nowrap;
            font-size: 0.75rem;
            color: var(--muted);
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 6px 9px;
            border-radius: 999px;
        }

        .editor-card {
            min-height: 0;
            height: 100%;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .editor-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            font-size: 0.76rem;
            color: var(--muted);
            flex: 0 0 auto;
        }

        .editor-scroll {
            min-height: 0;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 100%;
            border: 0;
            outline: 0;
            resize: none;
            background: transparent;
            color: var(--text);
            padding: 14px 14px 120px 14px;
            margin: 0;
            font: 400 19px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            caret-color: #000;
            -webkit-appearance: none;
            appearance: none;
        }

        textarea::placeholder {
            color: #9a978f;
        }

        .fab-wrap {
            position: fixed;
            right: calc(18px + var(--safe-right));
            bottom: calc(18px + var(--safe-bottom));
            z-index: 1001;
        }

        .fab {
            width: var(--fab-size);
            height: var(--fab-size);
            border-radius: 50%;
            border: 0;
            background: var(--accent);
            color: white;
            display: grid;
            place-items: center;
            box-shadow: 0 14px 30px rgba(0,0,0,0.28);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .fab:active { transform: scale(0.97); }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.08);
            z-index: 1000;
            display: none;
        }

        .overlay.show { display: block; }

        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1002;
            background: rgba(255,255,255,0.99);
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.18);
            padding: 10px 12px calc(16px + var(--safe-bottom)) 12px;
            transform: translateY(105%);
            transition: transform 160ms ease;
        }

        .sheet.open { transform: translateY(0); }

        .grabber {
            width: 42px;
            height: 5px;
            border-radius: 999px;
            background: rgba(0,0,0,0.15);
            margin: 4px auto 12px auto;
        }

        .menu-group {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: white;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .menu-item {
            width: 100%;
            text-align: left;
            border: 0;
            background: transparent;
            color: var(--text);
            padding: 16px 14px;
            border-radius: 16px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .menu-item:active {
            background: rgba(0,0,0,0.06);
        }

        .submenu {
            padding-left: 14px;
            padding-right: 10px;
            padding-bottom: 8px;
            display: none;
        }

        .submenu.open { display: block; }

        .submenu-item {
            width: 100%;
            text-align: left;
            border: 0;
            background: rgba(0,0,0,0.03);
            color: var(--text);
            padding: 14px 12px;
            border-radius: 14px;
            font-size: 0.98rem;
            margin: 8px 0 0 0;
        }

        .submenu-item:active {
            background: rgba(0,0,0,0.08);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(96px + var(--safe-bottom));
            transform: translateX(-50%) translateY(10px);
            background: rgba(20,20,18,0.94);
            color: white;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.92rem;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: 160ms ease;
            z-index: 1100;
            max-width: calc(100vw - 24px);
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (min-width: 720px) {
            .app {
                max-width: 760px;
                margin: 0 auto;
            }

            .sheet {
                left: auto;
                right: calc(18px + var(--safe-right));
                bottom: calc(92px + var(--safe-bottom));
                width: min(92vw, 320px);
                border-radius: 22px;
                transform: scale(0.96) translateY(8px);
                transform-origin: bottom right;
            }

            .sheet.open { transform: scale(1) translateY(0); }

            .grabber { display: none; }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="title-wrap">
            <h1 class="title">Markdown</h1>
            <p class="subtitle">Editing</p>
        </div>
        <div class="status" id="saveStatus">Saved</div>
    </header>

    <section class="editor-card">
        <div class="editor-meta">
            <span id="charCount">0 chars</span>
            <span id="wordCount">0 words</span>
        </div>
        <div class="editor-scroll">
        <textarea
                id="editor"
                spellcheck="true"
                autocapitalize="sentences"
                autocomplete="off"
                autocorrect="on"
                placeholder="# Start writing"
        ></textarea>
        </div>
    </section>
</div>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="menuSheet" aria-hidden="true">
    <div class="grabber"></div>

    <div class="menu-group">
        <button class="menu-item" id="printToggle" type="button">
            <span>Print</span>
            <span id="printChevron">▾</span>
        </button>
        <div class="submenu" id="printMenu">
            <button class="submenu-item" id="printBtn" type="button">Print Now</button>
            <button class="submenu-item" id="fetchBtn" type="button">Fetch</button>
        </div>
    </div>

    <div class="menu-group">
        <button class="menu-item" id="settingsToggle" type="button">
            <span>Settings</span>
            <span id="settingsChevron">▾</span>
        </button>
        <div class="submenu" id="settingsMenu">
            <button class="submenu-item" id="wifiBtn" type="button">Add WiFi Network</button>
        </div>
    </div>
</div>

<div class="fab-wrap">
    <button
            class="fab"
            id="fab"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
    >☰</button>
</div>

<div class="toast" id="toast"></div>

<script>
    (() => {
        const editor = document.getElementById("editor");
        const charCount = document.getElementById("charCount");
        const wordCount = document.getElementById("wordCount");
        const saveStatus = document.getElementById("saveStatus");
        const fab = document.getElementById("fab");
        const overlay = document.getElementById("overlay");
        const menuSheet = document.getElementById("menuSheet");
        const toast = document.getElementById("toast");

        const printToggle = document.getElementById("printToggle");
        const settingsToggle = document.getElementById("settingsToggle");
        const printMenu = document.getElementById("printMenu");
        const settingsMenu = document.getElementById("settingsMenu");
        const printChevron = document.getElementById("printChevron");
        const settingsChevron = document.getElementById("settingsChevron");

        const STORAGE_KEY = "mobile-markdown-editor-draft";

        function updateCounts() {
            const text = editor.value;
            charCount.textContent = `${text.length} chars`;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCount.textContent = `${words} words`;
        }

        function setSavedState(label) {
            saveStatus.textContent = label;
        }

        let saveTimer = null;

        function persistDraft() {
            clearTimeout(saveTimer);
            setSavedState("Saving…");
            saveTimer = setTimeout(() => {
                localStorage.setItem(STORAGE_KEY, editor.value);
                setSavedState("Saved");
            }, 180);
        }

        function restoreDraft() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved !== null) editor.value = saved;
            updateCounts();
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(showToast._timer);
            showToast._timer = setTimeout(() => {
                toast.classList.remove("show");
            }, 1800);
        }

        function openMenu() {
            overlay.classList.add("show");
            menuSheet.classList.add("open");
            fab.setAttribute("aria-expanded", "true");
            menuSheet.setAttribute("aria-hidden", "false");
        }

        function closeMenu() {
            overlay.classList.remove("show");
            menuSheet.classList.remove("open");
            fab.setAttribute("aria-expanded", "false");
            menuSheet.setAttribute("aria-hidden", "true");
        }

        function toggleMenu() {
            if (menuSheet.classList.contains("open")) closeMenu();
            else openMenu();
        }

        function toggleSubmenu(menu, chevron) {
            const isOpen = menu.classList.toggle("open");
            chevron.textContent = isOpen ? "▴" : "▾";
        }

        async function printDocument() {
            const body = editor.value;
            if (!body.trim()) {
                showToast("Nothing to print");
                return;
            }

            closeMenu();
            showToast("Printing…");

            try {
                const response = await fetch("/print", {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain; charset=utf-8"
                    },
                    body: body
                });

                if (!response.ok) {
                    throw new Error(`Print failed (${response.status})`);
                }

                showToast("Sent to printer");
            } catch (error) {
                console.error(error);
                showToast("Print failed");
            }
        }

        editor.addEventListener("input", () => {
            updateCounts();
            persistDraft();
        });

        fab.addEventListener("click", toggleMenu);
        overlay.addEventListener("click", closeMenu);

        printToggle.addEventListener("click", () => toggleSubmenu(printMenu, printChevron));
        settingsToggle.addEventListener("click", () => toggleSubmenu(settingsMenu, settingsChevron));

        document.getElementById("printBtn").addEventListener("click", printDocument);
        document.getElementById("fetchBtn").addEventListener("click", () => {
            closeMenu();
            showToast("Fetch action");
        });
        document.getElementById("wifiBtn").addEventListener("click", () => {
            closeMenu();
            showToast("Add WiFi Network");
        });

        restoreDraft();
        if (!editor.value.trim()) setSavedState("New draft");
    })();
</script>
</body>
</html>
