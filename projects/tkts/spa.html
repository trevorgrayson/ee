<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>tkts.local</title>
    <style>
        :root {
            --bg: #f6f6f3;
            --panel: rgba(255,255,255,0.98);
            --text: #1f1f1a;
            --muted: #6f6c63;
            --line: rgba(0,0,0,0.08);
            --accent: #111111;
            --shadow: 0 12px 32px rgba(0,0,0,0.10);
            --radius: 18px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overscroll-behavior: none;
        }

        .app {
            height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr;
            padding:
                    calc(8px + var(--safe-top))
                    calc(10px + var(--safe-right))
                    calc(10px + var(--safe-bottom))
                    calc(10px + var(--safe-left));
            gap: 8px;
            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 40px;
            padding: 0 4px;
        }

        .title-wrap {
            min-width: 0;
            flex: 1;
        }

        .title {
            margin: 0;
            font-size: 0.98rem;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 2px 0 0 0;
            font-size: 0.74rem;
            line-height: 1.1;
            color: var(--muted);
        }

        .status {
            white-space: nowrap;
            font-size: 0.75rem;
            color: var(--muted);
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 6px 9px;
            border-radius: 999px;
        }

        .topbar-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .pill-btn {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            font-size: 0.72rem;
            padding: 6px 10px;
            border-radius: 999px;
            letter-spacing: 0.01em;
            cursor: pointer;
        }

        .pill-btn:active {
            background: rgba(0,0,0,0.06);
        }

        .editor-card {
            min-height: 0;
            height: 100%;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .editor-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--line);
            font-size: 0.76rem;
            color: var(--muted);
            flex: 0 0 auto;
        }

        .editor-scroll {
            min-height: 0;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 100%;
            border: 0;
            outline: 0;
            resize: none;
            background: transparent;
            color: var(--text);
            padding: 14px 14px 120px 14px;
            margin: 0;
            font: 400 19px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            caret-color: #000;
            -webkit-appearance: none;
            appearance: none;
        }

        textarea::placeholder {
            color: #9a978f;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(96px + var(--safe-bottom));
            transform: translateX(-50%) translateY(10px);
            background: rgba(20,20,18,0.94);
            color: white;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.92rem;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: 160ms ease;
            z-index: 1100;
            max-width: calc(100vw - 24px);
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (min-width: 720px) {
            .app {
                max-width: 760px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="title-wrap">
            <h1 class="title">tkts.local</h1>
            <p class="subtitle">Editing</p>
        </div>
        <div class="topbar-actions">
            <button class="pill-btn" id="printBtn" type="button">Print</button>
            <button class="pill-btn" id="fetchBtn" type="button">Fetch</button>
            <div class="status" id="saveStatus">Saved</div>
        </div>
    </header>

    <section class="editor-card">
        <div class="editor-meta">
            <span id="charCount">0 chars</span>
            <span id="wordCount">0 words</span>
        </div>
        <div class="editor-scroll">
        <textarea
                id="editor"
                spellcheck="true"
                autocapitalize="sentences"
                autocomplete="off"
                autocorrect="on"
                placeholder="# Start writing"
        ></textarea>
        </div>
    </section>
</div>

<div class="toast" id="toast"></div>

<script>
    (() => {
        const editor = document.getElementById("editor");
        const charCount = document.getElementById("charCount");
        const wordCount = document.getElementById("wordCount");
        const saveStatus = document.getElementById("saveStatus");
        const toast = document.getElementById("toast");

        const STORAGE_KEY = "mobile-markdown-editor-draft";

        function updateCounts() {
            const text = editor.value;
            charCount.textContent = `${text.length} chars`;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCount.textContent = `${words} words`;
        }

        function setSavedState(label) {
            saveStatus.textContent = label;
        }

        let saveTimer = null;

        function persistDraft() {
            clearTimeout(saveTimer);
            setSavedState("Saving…");
            saveTimer = setTimeout(() => {
                localStorage.setItem(STORAGE_KEY, editor.value);
                setSavedState("Saved");
            }, 180);
        }

        function restoreDraft() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved !== null) editor.value = saved;
            updateCounts();
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(showToast._timer);
            showToast._timer = setTimeout(() => {
                toast.classList.remove("show");
            }, 1800);
        }

        async function fetchUrl(url) {
            const response = await fetch(`/fetch?url=${encodeURIComponent(url)}`);
            if (!response.ok) {
                throw new Error(`Fetch failed (${response.status})`);
            }
            return response.text();
        }

        async function printDocument() {
            const body = editor.value;
            if (!body.trim()) {
                showToast("Nothing to print");
                return;
            }

            showToast("Printing…");

            try {
                const response = await fetch("/print", {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain; charset=utf-8"
                    },
                    body: body
                });

                if (!response.ok) {
                    throw new Error(`Print failed (${response.status})`);
                }

                showToast("Sent to printer");
            } catch (error) {
                console.error(error);
                showToast("Print failed");
            }
        }

        editor.addEventListener("input", () => {
            updateCounts();
            persistDraft();
        });

        document.getElementById("printBtn").addEventListener("click", printDocument);
        document.getElementById("fetchBtn").addEventListener("click", async () => {
            const url = prompt("Fetch URL");
            if (!url) return;
            showToast("Fetching…");
            try {
                const body = await fetchUrl(url);
                editor.value = body;
                updateCounts();
                persistDraft();
                showToast("Fetched");
            } catch (error) {
                console.error(error);
                showToast("Fetch failed");
            }
        });

        restoreDraft();
        if (!editor.value.trim()) setSavedState("New draft");
    })();
</script>
</body>
</html>
